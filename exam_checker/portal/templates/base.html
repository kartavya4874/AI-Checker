<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hybrid AI Exam Checker{% endblock %}</title>
    <!-- Tailwind CSS (via CDN for simplicity) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .sidebar {
            background-color: #161b22;
            border-right: 1px solid #30363d;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
        }
        .accent-bg { background-color: #238636; }
        .accent-text { color: #58a6ff; }
        .accent-border { border-color: #58a6ff; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background-color: #21262d; border-bottom: 1px solid #30363d; padding: 12px; text-align: left; }
        td { border-bottom: 1px solid #30363d; padding: 12px; }
        tr:hover { background-color: #21262d; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar w-64 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-700">
            <h1 class="text-xl font-bold text-white tracking-widest">AI EXAM CHECKER</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/" class="flex items-center space-x-2 px-4 py-3 rounded-lg hover:bg-gray-800 {{ 'bg-gray-800' if request.url.path == '/' else '' }}">
                <span>Dashboard</span>
            </a>
            <a href="/upload" class="flex items-center space-x-2 px-4 py-3 rounded-lg hover:bg-gray-800 {{ 'bg-gray-800' if request.url.path.startswith('/upload') else '' }}">
                <span>Process Exams</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 flex items-center justify-between px-6 bg-[#161b22] border-b border-gray-700">
            <div class="md:hidden">
                <span class="text-xl font-bold text-white">AI EXAM CHECKER</span>
            </div>
            <div class="flex items-center space-x-4 ml-auto">
                <span class="text-sm text-gray-400">System Ready</span>
            </div>
        </header>
        
        <div class="flex-1 overflow-auto p-6">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
